name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mithra
          POSTGRES_PASSWORD: mithra
          POSTGRES_DB: mithra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mithra"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      # The suites read this one; it must not name the development database.
      BINA_TEST_DATABASE_URL: postgresql+psycopg://mithra:mithra@localhost:5432/mithra_test
      DATABASE_URL: postgresql+psycopg://mithra:mithra@localhost:5432/mithra
      REDIS_URL: redis://localhost:6379/0
      MAPILLARY_TOKEN: "MLY|test|test"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No editable install: pytest.ini already puts the packages on the path,
      # and `pip install -e` on this layout makes setuptools guess which of
      # several top-level directories is the package.
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.32" "sqlalchemy>=2.0" \
            "geoalchemy2>=0.15" "alembic>=1.13" "psycopg[binary]>=3.2" \
            "pydantic-settings>=2.5" "httpx>=0.27" "rq>=1.16" "redis>=5.0" \
            "pillow>=10.4" "mapbox-vector-tile>=2.1" "shapely>=2.0" \
            "argon2-cffi>=23.1" "email-validator>=2.2" \
            "open_clip_torch>=2.26" "pytest>=8.3" "respx>=0.21"
      - name: Test
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the runtime image; npm 10 cannot read a lockfile npm 11 wrote.
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx vitest run
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8020
