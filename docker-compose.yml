services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bina
      POSTGRES_PASSWORD: bina
      POSTGRES_DB: bina
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bina"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
