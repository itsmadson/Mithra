services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bina
      POSTGRES_PASSWORD: bina
      POSTGRES_DB: bina
    # Host-side ports are shifted off the defaults because a machine that already
    # runs Postgres or Redis natively will otherwise refuse to start these, and
    # the app then silently talks to the wrong server.
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bina"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6381:6379"]
