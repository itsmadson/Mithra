# Mithra — one hostname, two upstreams.
#
# Copy to nginx_config/conf.d/mithra.conf on the server, change server_name and
# the two upstream addresses, then: docker exec nginx nginx -t && docker exec
# nginx nginx -s reload
#
# The address below is the host, not 127.0.0.1: nginx runs in a container, so
# localhost there is the nginx container itself. It has to match BIND_ADDR in
# Mithra's .env — see deploy/README.md.
#
# Order matters. /api/ is matched before / so console navigation never swallows
# an API call.

server {
    listen 443 ssl;
    http2 on;

    server_name mithra.geotajak.ir;

    include /etc/nginx/conf.d/includes/ssl-geotajak.conf;

    # GeoTIFF uploads are the largest thing this application accepts, and a
    # single-band scene of a city is comfortably past nginx's 1 MB default.
    # Anything larger than this should be read from a COG URL or a tile service
    # rather than pushed through the proxy.
    client_max_body_size 512M;

    # API, exports, and the crop images the console displays. Same hostname as
    # the console, so the session cookie is first-party and no CORS is involved.
    location /api/ {
        proxy_pass http://185.53.142.74:8092;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;

        # A detection run is started here but not performed here — the API
        # returns as soon as the job is queued, so these are ordinary timeouts.
        # It is the worker that takes an hour, and nothing waits on it.
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # An export of a large inventory is streamed row by row. Buffering it
        # would hold the whole CSV in nginx before sending any of it.
        proxy_buffering off;
    }

    # The console. A Next.js server, not a directory of files — it renders each
    # page per request, so it is proxied rather than mounted like the static
    # frontends in this deployment.
    location / {
        proxy_pass http://185.53.142.74:3092;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Immutable build assets. The filename changes whenever the content does,
    # so they can be cached hard — and this is what makes a second page load
    # feel instant over a slow link.
    location /_next/static/ {
        proxy_pass http://185.53.142.74:3092;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;

        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# Plain HTTP goes to HTTPS and nowhere else. The session cookie is issued with
# Secure set, so an HTTP page could sign in and appear to succeed while the
# browser silently discards the cookie.
server {
    listen 80;
    server_name mithra.geotajak.ir;
    return 301 https://$host$request_uri;
}
