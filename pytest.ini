; Anchors pytest's rootdir at the repository. Without this, pytest walks up
; and finds the pyproject.toml in the parent home directory, which silently
; discards the pythonpath below and breaks every import.
[pytest]
testpaths = tests
pythonpath =
    services/api
    services/worker
    packages/ml
    .
norecursedirs = tests/e2e node_modules .venv
